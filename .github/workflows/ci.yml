name: CI

on:
  push:
  pull_request:

# Builds on both supported platforms, runs the whole test suite, and then exercises the
# documented command line against the bundled reference adapter — the same path a user
# following the README would take.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B --no-transfer-progress clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard logic
        run: node --test src/test/js/dashboard.test.cjs
      - name: Evaluate with the reference adapter
        shell: bash
        run: |
          java -jar target/assay.jar run \
            --adapter io.assay.examples.EchoAdapter \
            --suite smoke \
            --cases examples/cases.example.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --collect-few-shot
      - name: Exercise the evolution workflows
        shell: bash
        run: |
          java -jar target/assay.jar evolve \
            --baseline-adapter 'io.assay.examples.IntentRouterAdapters$Baseline' \
            --candidate-adapter 'io.assay.examples.IntentRouterAdapters$Candidate' \
            --candidate examples/evolution.candidate.json \
            --policy examples/evolution.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --experiment-id ci-evolution
          java -jar target/assay.jar evolve-auto \
            --auto-adapter io.assay.examples.IntentRouterAutoEvolution \
            --policy examples/evolution.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --max-rounds 1 --max-candidates-per-round 2 --loop-id ci-loop
      - name: Build and test the optional extensions
        if: runner.os == 'Linux'
        run: |
          mvn -B --no-transfer-progress -q -DskipTests install
          mvn -B --no-transfer-progress -q -f extensions/assay-spring-boot-starter/pom.xml test
          mvn -B --no-transfer-progress -q -f extensions/assay-metrics-micrometer/pom.xml test
      - name: Build container image
        if: runner.os == 'Linux'
        run: docker build -t assay:ci .
      - name: Exercise first-error diagnosis
        shell: bash
        run: |
          set +e
          java -jar target/assay.jar evolve \
            --baseline-adapter 'io.assay.examples.IntentRouterAdapters$Candidate' \
            --candidate-adapter 'io.assay.examples.IntentRouterAdapters$Regressed' \
            --candidate examples/evolution.regressed.candidate.json \
            --policy examples/evolution.regressed.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --experiment-id ci-regression
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"decision": "rollback"' .assay/runs/ci-regression/evolution.json
          grep -q '"category": "step_fields"' .assay/runs/ci-regression/evolution.json
      - name: Exercise external trace ingestion
        shell: bash
        run: |
          set +e
          java -jar target/assay.jar evolve \
            --baseline-adapter examples/trace-candidate.example.json \
            --candidate-adapter examples/trace-regressed.example.json \
            --candidate examples/evolution.trace-regressed.candidate.json \
            --policy examples/evolution.regressed.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --source offline \
            --store .assay/store \
            --output .assay/runs \
            --experiment-id ci-trace
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"category": "step_fields"' .assay/runs/ci-trace/evolution.json
      - name: Publish quality summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Assay quality summary"
            for report in .assay/runs/*/evolution_report.md; do
              [ -f "$report" ] || continue
              echo ""
              echo "### ${report#.assay/runs/}"
              cat "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ runner.os }}
          path: .assay/runs
          if-no-files-found: ignore
