name: CI

on:
  push:
  pull_request:

# Builds on both supported platforms, runs the whole test suite, and then exercises the
# documented command line against the bundled reference adapter — the same path a user
# following the README would take.
permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B --no-transfer-progress clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard logic
        run: node --test assay-dashboard/src/test/js/dashboard.test.cjs
      - name: Evaluate with the reference adapter
        shell: bash
        run: |
          java -jar app/target/assay.jar run \
            --adapter io.assay.examples.EchoAdapter \
            --suite smoke \
            --cases examples/cases.example.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --collect-few-shot
      - name: Exercise the evolution workflows
        shell: bash
        run: |
          java -jar app/target/assay.jar evolve \
            --baseline-adapter 'io.assay.examples.IntentRouterAdapters$Baseline' \
            --candidate-adapter 'io.assay.examples.IntentRouterAdapters$Candidate' \
            --candidate examples/evolution.candidate.json \
            --policy examples/evolution.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --experiment-id ci-evolution
          java -jar app/target/assay.jar evolve-auto \
            --auto-adapter io.assay.examples.IntentRouterAutoEvolution \
            --policy examples/evolution.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --max-rounds 1 --max-candidates-per-round 2 --loop-id ci-loop
      - name: Build container image
        if: runner.os == 'Linux'
        run: docker build -t assay:ci .
      - name: Exercise first-error diagnosis
        shell: bash
        run: |
          set +e
          java -jar app/target/assay.jar evolve \
            --baseline-adapter 'io.assay.examples.IntentRouterAdapters$Candidate' \
            --candidate-adapter 'io.assay.examples.IntentRouterAdapters$Regressed' \
            --candidate examples/evolution.regressed.candidate.json \
            --policy examples/evolution.regressed.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --store .assay/store \
            --output .assay/runs \
            --experiment-id ci-regression
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"decision": "rollback"' .assay/runs/ci-regression/evolution.json
          grep -q '"category": "step_fields"' .assay/runs/ci-regression/evolution.json
      - name: Compare stored runs with a release gate
        shell: bash
        run: |
          set +e
          java -jar app/target/assay.jar compare \
            --baseline ci-regression-holdout-baseline \
            --candidate ci-regression-holdout-candidate \
            --store .assay/store \
            --profile strict \
            --output .assay/runs/ci-compare/report.md
          status=$?
          set -e
          test "$status" -eq 1
          cat .assay/runs/ci-compare/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the comparison on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- assay-compare-gate -->";
            const report = fs.readFileSync(".assay/runs/ci-compare/report.md", "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Exercise external trace ingestion
        shell: bash
        run: |
          set +e
          java -jar app/target/assay.jar evolve \
            --baseline-adapter examples/trace-candidate.example.json \
            --candidate-adapter examples/trace-regressed.example.json \
            --candidate examples/evolution.trace-regressed.candidate.json \
            --policy examples/evolution.regressed.policy.json \
            --improvement examples/evolution.improvement.jsonl \
            --regression examples/evolution.regression.jsonl \
            --holdout examples/evolution.holdout.jsonl \
            --source offline \
            --store .assay/store \
            --output .assay/runs \
            --experiment-id ci-trace
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"category": "step_fields"' .assay/runs/ci-trace/evolution.json
      - name: Publish quality summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Assay quality summary"
            for report in .assay/runs/*/evolution_report.md; do
              [ -f "$report" ] || continue
              echo ""
              echo "### ${report#.assay/runs/}"
              cat "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ runner.os }}
          path: .assay/runs
          if-no-files-found: ignore
