<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assay · 评测工作台</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/paper.css">
  <script src="/dashboard-core.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="page-texture" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg">
      <filter id="paper-grain">
        <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#paper-grain)"/>
    </svg>
  </div>

  <div class="book-shell">
    <div class="inner-frame">
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <header class="masthead">
        <button type="button" class="brand" data-section="overview" aria-label="Assay 总览">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 4h8M14 4v9L6 25a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3l-8-12V4M10 20h12"/></svg>
          <span>Assay<small>AGENT EVALUATION ATELIER</small></span>
        </button>

        <div class="masthead-center">
          <div class="breadcrumb">Cahier d'évaluation <span>/</span> <strong id="section-label">总览</strong></div>
          <div class="edition">ÉDITION LOCALE · <span id="refresh-time">尚未刷新</span></div>
        </div>

        <div class="top-actions">
          <label class="theme-picker">主题<select id="theme-select" aria-label="界面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
          <label class="search"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="搜索记录或文件路径" aria-label="搜索记录或文件路径"></label>
          <button class="button secondary" id="import-button">导入 JSON</button>
          <button class="button primary" id="refresh-button">刷新结果</button>
          <input id="file-input" type="file" accept=".json,application/json" multiple hidden>
        </div>
      </header>

      <nav id="navigation" class="menu-ribbons" aria-label="主要导航"></nav>

      <main id="view" class="page-stage" tabindex="-1"><div class="empty" role="status">正在读取报告…</div></main>

      <footer class="colophon">
        <span id="source-path">报告目录：—</span>
        <span class="colophon-mark" aria-hidden="true">Assay · les mots justes</span>
        <span>本地报告 · 只读 · 以证据支持每一次迭代</span>
      </footer>
    </div>
  </div>

  <div id="toast" role="status" hidden></div>
</body>
</html>
