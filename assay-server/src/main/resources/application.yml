server:
  port: 8080

assay:
  server:
    store: .assay/store
    output: .assay/runs
    workers: 1
    retries: 0
    timeout-seconds: 30
    collect-few-shot: false
    worker-threads: 2
    job-lease-seconds: 60
    poll-millis: 500
    job-max-attempts: 1
    # auth-tokens: [dev-token]   # uncomment to require Authorization: Bearer / X-API-Key

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
