<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assay · 评测工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/dashboard-core.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Assay 总览">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 4h8M14 4v9L6 25a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3l-8-12V4M10 20h12"/></svg>
      <span>Assay<small>AGENT EVALUATION</small></span>
    </a>
    <div class="nav-caption">工作区</div>
    <nav id="navigation" aria-label="主要导航"></nav>
    <div class="sidebar-footer"><span class="live-dot"></span> 本地报告 · 只读<span class="footer-note">以评测证据支持每一次迭代</span></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="breadcrumb">Assay <span>/</span> <strong id="section-label">总览</strong></div>
      <div class="top-actions">
        <label class="search"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="搜索记录或文件路径" aria-label="搜索记录或文件路径"></label>
        <button class="button secondary" id="import-button">导入 JSON</button>
        <button class="button primary" id="refresh-button">刷新结果</button>
        <input id="file-input" type="file" accept=".json,application/json" multiple hidden>
      </div>
    </header>
    <main id="view" aria-live="polite"><div class="empty">正在读取报告…</div></main>
    <footer class="workspace-source"><span id="source-path"></span><span id="refresh-time"></span></footer>
  </div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
